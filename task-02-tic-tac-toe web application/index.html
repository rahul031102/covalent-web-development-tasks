<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TIC · TAC · TOE</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Google Fonts: Press Start 2P (retro pixel) + Share Tech Mono (techy mono) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- ═══════════════════════════════════════════
       SCANLINE OVERLAY — pure CSS retro CRT effect
  ════════════════════════════════════════════ -->
  <div class="scanlines" aria-hidden="true"></div>

  <!-- ═══════════════════════════════════════════
       MAIN WRAPPER
  ════════════════════════════════════════════ -->
  <div class="app">

    <!-- ── HEADER ───────────────────────────── -->
    <header class="header">
      <div class="logo">
        <span class="logo-x">X</span>
        <span class="logo-title">TIC·TAC·TOE</span>
        <span class="logo-o">O</span>
      </div>
      <p class="logo-sub">ARCADE EDITION</p>
    </header>

    <!-- ── MODE SELECTOR ────────────────────── -->
    <div class="mode-selector" id="modeSelector">
      <button class="mode-btn active" id="btnPvP" data-mode="pvp">
        <span class="mode-icon">👥</span>
        <span>PVP</span>
      </button>
      <button class="mode-btn" id="btnAI" data-mode="ai">
        <span class="mode-icon">🤖</span>
        <span>VS AI</span>
      </button>
    </div>

    <!-- ── SCORE BOARD ───────────────────────── -->
    <div class="scoreboard">
      <div class="score-card" id="scoreX">
        <div class="score-symbol x-symbol">X</div>
        <div class="score-label" id="labelX">PLAYER 1</div>
        <div class="score-value" id="scoreXVal">0</div>
      </div>
      <div class="score-divider">
        <div class="score-draw-label">DRAWS</div>
        <div class="score-draw-val" id="scoreDrawVal">0</div>
      </div>
      <div class="score-card" id="scoreO">
        <div class="score-symbol o-symbol">O</div>
        <div class="score-label" id="labelO">PLAYER 2</div>
        <div class="score-value" id="scoreOVal">0</div>
      </div>
    </div>

    <!-- ── STATUS BAR ────────────────────────── -->
    <div class="status-bar">
      <div class="status-indicator" id="statusIndicator"></div>
      <p class="status-text" id="statusText">PLAYER X'S TURN</p>
    </div>

    <!-- ── GAME BOARD ────────────────────────── -->
    <div class="board-wrapper">
      <!-- Decorative corner brackets -->
      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>

      <div class="board" id="board" role="grid" aria-label="Tic Tac Toe board">
        <!-- 9 cells generated by JS, but we pre-define them for semantics -->
        <button class="cell" data-index="0" aria-label="Cell 1" role="gridcell"></button>
        <button class="cell" data-index="1" aria-label="Cell 2" role="gridcell"></button>
        <button class="cell" data-index="2" aria-label="Cell 3" role="gridcell"></button>
        <button class="cell" data-index="3" aria-label="Cell 4" role="gridcell"></button>
        <button class="cell" data-index="4" aria-label="Cell 5" role="gridcell"></button>
        <button class="cell" data-index="5" aria-label="Cell 6" role="gridcell"></button>
        <button class="cell" data-index="6" aria-label="Cell 7" role="gridcell"></button>
        <button class="cell" data-index="7" aria-label="Cell 8" role="gridcell"></button>
        <button class="cell" data-index="8" aria-label="Cell 9" role="gridcell"></button>
      </div>

      <!-- Win-line overlay drawn by JS -->
      <canvas class="win-line-canvas" id="winLineCanvas"></canvas>
    </div>

    <!-- ── CONTROLS ──────────────────────────── -->
    <div class="controls">
      <button class="ctrl-btn" id="btnRestart" title="Restart round">
        ↺ RESTART
      </button>
      <button class="ctrl-btn ctrl-btn--secondary" id="btnReset" title="Reset scores">
        ✕ RESET SCORES
      </button>
      <button class="ctrl-btn ctrl-btn--mute" id="btnMute" title="Toggle sound">
        🔊
      </button>
    </div>

    <!-- ── FOOTER ────────────────────────────── -->
    <footer class="footer">
      <p>MINIMAX AI · UNBEATABLE</p>
    </footer>

  </div><!-- /.app -->

  <!-- ═══════════════════════════════════════════
       RESULT OVERLAY (shown on game end)
  ════════════════════════════════════════════ -->
  <div class="overlay" id="overlay" aria-live="assertive" aria-hidden="true">
    <div class="overlay-content">
      <div class="overlay-symbol" id="overlaySymbol"></div>
      <h2 class="overlay-title" id="overlayTitle"></h2>
      <p class="overlay-sub" id="overlaySub"></p>
      <button class="overlay-btn" id="overlayBtn">PLAY AGAIN</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
